<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Aina's Library</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png.jpg?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f7f6f3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Pantalla de carga -->
  <div class="screen" id="loading-screen">
    <h1 class="brand">Aina's Library</h1>
  </div>

  <!-- Inicio de sesión -->
  <div class="screen" id="login-screen" hidden>
    <form class="login-card" id="login-form">
      <h1 class="brand">Aina's Library</h1>
      <p class="muted">Inicia sesión para ver tu biblioteca</p>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Contraseña</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="login-error" hidden></p>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
  </div>

  <div class="app" id="app" hidden>
    <!-- Cabecera -->
    <header class="topbar">
      <h1 class="brand">Aina's Library</h1>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-search" aria-label="Buscar">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        </button>
        <button class="icon-btn" data-goto="profile" aria-label="Perfil">
          <svg viewBox="0 0 24 24" id="header-avatar-icon"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.2c1.3-2.2 3.2-3.2 5.5-3.2s4.2 1 5.5 3.2"/></svg>
          <img class="header-avatar" id="header-avatar" alt="" hidden>
        </button>
      </div>
    </header>

    <!-- Barra de búsqueda (oculta por defecto) -->
    <div class="search-bar" id="search-bar" hidden>
      <input type="search" id="search-input" placeholder="Buscar libros o autores…" autocomplete="off">
    </div>

    <!-- Contenido -->
    <main class="content">
      <section class="view is-active" id="view-library" aria-label="Biblioteca">
        <div class="segmented" id="status-tabs" role="tablist" aria-label="Estado de lectura">
          <button role="tab" class="segment is-active" data-status="reading">Leyendo <span class="count" data-count="reading">0</span></button>
          <button role="tab" class="segment" data-status="read">Leídos <span class="count" data-count="read">0</span></button>
          <button role="tab" class="segment" data-status="pending">Pendientes <span class="count" data-count="pending">0</span></button>
        </div>
        <div class="toolbar">
          <button type="button" class="chip" data-sort-view="library">
            <svg viewBox="0 0 24 24"><path d="M4 7h10M4 12h7M4 17h4M17 5v14M14 16l3 3 3-3"/></svg>
            <span class="chip-label"></span>
          </button>
        </div>
        <div class="book-grid" id="book-grid"></div>
        <p class="empty" id="empty-msg" hidden></p>
        <button class="fab" id="btn-add" aria-label="Añadir libro">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </section>

      <section class="view" id="view-explore" aria-label="Explorar">
        <div class="toolbar">
          <button type="button" class="chip" data-sort-view="explore">
            <svg viewBox="0 0 24 24"><path d="M4 7h10M4 12h7M4 17h4M17 5v14M14 16l3 3 3-3"/></svg>
            <span class="chip-label"></span>
          </button>
        </div>
        <div id="catalog"></div>
        <p class="empty" id="catalog-empty" hidden></p>
      </section>

      <section class="view" id="view-discover" aria-label="Descubrir">
        <div class="placeholder">
          <h2>Descubrir</h2>
          <p>Próximamente: recomendaciones y novedades.</p>
        </div>
      </section>

      <section class="view" id="view-profile" aria-label="Perfil">
        <div class="profile">
          <div class="avatar-wrap">
            <button type="button" class="avatar" id="btn-avatar" aria-label="Cambiar foto de perfil">
              <img id="profile-avatar" alt="Foto de perfil" hidden>
              <span class="avatar-initial" id="avatar-initial"></span>
              <span class="avatar-camera" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
              </span>
            </button>
            <input type="file" id="avatar-input" accept="image/*" hidden>
          </div>
          <p class="avatar-status" id="avatar-status" hidden></p>
          <button type="button" class="link-btn" id="btn-remove-avatar" hidden>Quitar foto</button>
          <h2>Perfil</h2>
          <p class="muted" id="profile-email"></p>
          <div class="stats">
            <div class="stat"><strong id="stat-read">0</strong><span>Leídos</span></div>
            <div class="stat"><strong id="stat-reading">0</strong><span>Leyendo</span></div>
            <div class="stat"><strong id="stat-pending">0</strong><span>Pendientes</span></div>
          </div>
          <label class="toggle">
            <span>Mostrar la mascota</span>
            <input type="checkbox" id="pet-toggle" checked>
          </label>
          <button class="btn btn-secondary" id="btn-logout">Cerrar sesión</button>
        </div>
      </section>
    </main>

    <!-- Mascota -->
    <div class="pet" id="pet">
      <div class="pet-bubble" id="pet-bubble" role="status" aria-live="polite" hidden>
        <p id="pet-text"></p>
        <button type="button" class="pet-action" id="pet-action" hidden></button>
      </div>
      <button type="button" class="pet-dog" id="pet-dog" aria-label="Jack, tu compañero de lectura: tócalo para que te diga algo">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <!-- Jack: cachorro negro sentado leyendo, inspirado en el icono de la app -->
          <g class="pet-tail"><path d="M66 86 Q80 90 92 82 Q95 86 89 90 Q78 96 66 92 Z" class="fur line" /></g>
          <!-- cuerpo sentado -->
          <path d="M31 94 Q24 72 35 58 Q50 49 65 58 Q76 72 69 94 Z" class="fur line" />
          <ellipse cx="35" cy="85" rx="10" ry="9" class="fur line" />
          <ellipse cx="65" cy="85" rx="10" ry="9" class="fur line" />
          <ellipse cx="31" cy="94.5" rx="8.5" ry="3.8" class="fur line" />
          <ellipse cx="69" cy="94.5" rx="8.5" ry="3.8" class="fur line" />
          <path d="M27 95 v-2.5 M30.5 96 v-2.5 M34 95.5 v-2.5 M66 95.5 v-2.5 M69.5 96 v-2.5 M73 95 v-2.5" class="toes" />
          <!-- libro -->
          <g class="pet-book">
            <path d="M36 66 L52 70 L52 85 L36 81 Z" class="book-cover" />
            <path d="M52 70 L64 65 L64 80 L52 85 Z" class="book-cover" />
            <path d="M37.5 65 L52 68.5 L62.5 64 L62.5 66 L52 70.5 L37.5 67 Z" class="book-pages" />
            <path d="M40 73 l8 2 M40 76 l8 2 M40 79 l6 1.5" class="book-text" />
          </g>
          <!-- patas delanteras sujetando el libro -->
          <ellipse cx="36.5" cy="74" rx="5" ry="5.5" class="fur line" />
          <ellipse cx="63.5" cy="72" rx="5" ry="5.5" class="fur line" />
          <g class="pet-head">
            <!-- orejas caídas -->
            <path d="M35 22 Q22 22 22 38 Q23 48 31 45 Q33 34 38 27 Z" class="ear line" />
            <path d="M65 22 Q78 22 78 38 Q77 48 69 45 Q67 34 62 27 Z" class="ear line" />
            <ellipse cx="50" cy="35" rx="18" ry="17" class="fur line" />
            <ellipse cx="50" cy="45" rx="10" ry="7.5" class="muzzle" />
            <path d="M39 28.5 q3 -2 6 0 M55 28.5 q3 -2 6 0" class="brow" />
            <g class="pet-eyes">
              <ellipse cx="42.5" cy="34" rx="3.2" ry="2.8" class="eye-white" />
              <ellipse cx="57.5" cy="34" rx="3.2" ry="2.8" class="eye-white" />
              <circle cx="42.8" cy="35" r="2.1" class="eye" />
              <circle cx="57.8" cy="35" r="2.1" class="eye" />
              <circle cx="42.9" cy="35.3" r="1.1" class="pupil" />
              <circle cx="57.9" cy="35.3" r="1.1" class="pupil" />
              <circle cx="43.6" cy="34.3" r="0.6" class="shine" />
              <circle cx="58.6" cy="34.3" r="0.6" class="shine" />
            </g>
            <ellipse cx="50" cy="42" rx="4.6" ry="3.2" class="nose" />
            <ellipse cx="48.6" cy="41" rx="1.5" ry="0.8" class="shine" />
            <path d="M50 45.2 v1.8 M45.5 47.5 Q50 50.5 54.5 47.5" class="mouth" />
            <circle cx="44" cy="46" r="0.45" class="whisker" /><circle cx="45.4" cy="47" r="0.45" class="whisker" />
            <circle cx="56" cy="46" r="0.45" class="whisker" /><circle cx="54.6" cy="47" r="0.45" class="whisker" />
            <path d="M48 49 Q50 54 52 49 Z" class="tongue" />
          </g>
        </svg>
      </button>
    </div>

    <!-- Menú inferior -->
    <nav class="tabbar" aria-label="Navegación principal">
      <button class="tab is-active" data-goto="library">
        <svg viewBox="0 0 24 24"><path d="M5 4v16M9 4v16"/><path d="M13 5l3.5-1 3.5 15-3.5 1z"/></svg>
        <span>Biblioteca</span>
      </button>
      <button class="tab" data-goto="explore">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
        <span>Explorar</span>
      </button>
      <button class="tab" data-goto="discover">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
        <span>Descubrir</span>
      </button>
      <button class="tab" data-goto="profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-3.8 3.8-5.5 7-5.5s6 1.7 7 5.5"/></svg>
        <span>Perfil</span>
      </button>
    </nav>
  </div>

  <!-- Formulario de libro (añadir / editar) -->
  <dialog class="sheet" id="book-dialog">
    <form id="book-form" method="dialog">
      <header class="sheet-header">
        <h2 id="book-dialog-title">Nuevo libro</h2>
        <button type="button" class="icon-btn" id="btn-close-dialog" aria-label="Cerrar">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <label class="field">
        <span>Título *</span>
        <input name="title" required maxlength="200">
      </label>
      <label class="field">
        <span>Autor</span>
        <input name="author" maxlength="200">
      </label>

      <div class="field-row">
        <label class="field">
          <span>Estado</span>
          <select name="status">
            <option value="pending">Pendiente</option>
            <option value="reading">Leyendo</option>
            <option value="read">Leído</option>
          </select>
        </label>
        <label class="field">
          <span>Puntuación</span>
          <select name="rating">
            <option value="">—</option>
            <option value="1">★</option>
            <option value="2">★★</option>
            <option value="3">★★★</option>
            <option value="4">★★★★</option>
            <option value="5">★★★★★</option>
          </select>
        </label>
      </div>

      <label class="field">
        <span>Fecha en que lo terminó</span>
        <input type="date" name="finished_at">
      </label>

      <fieldset class="field">
        <span>Color de portada</span>
        <div class="swatches" id="swatches"></div>
      </fieldset>

      <label class="field">
        <span>URL de imagen de portada (opcional)</span>
        <input type="url" name="cover_url" placeholder="https://…">
      </label>

      <label class="field">
        <span>Notas</span>
        <textarea name="notes" rows="4"></textarea>
      </label>

      <p class="form-error" id="book-error" hidden></p>

      <div class="sheet-actions">
        <button type="button" class="btn btn-danger" id="btn-delete" hidden>Eliminar</button>
        <button type="submit" class="btn btn-primary" id="btn-save">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Ordenar y filtrar -->
  <dialog class="sheet" id="sort-dialog">
    <div class="sheet-body">
      <header class="sheet-header">
        <h2>Ordenar y filtrar</h2>
        <button type="button" class="icon-btn" id="btn-close-sort" aria-label="Cerrar">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <fieldset class="option-group">
        <legend>Ordenar por</legend>
        <div id="sort-options"></div>
      </fieldset>
      <fieldset class="option-group">
        <legend>Filtrar</legend>
        <div id="filter-options"></div>
      </fieldset>
      <div class="sheet-actions">
        <button type="button" class="btn btn-secondary" id="btn-reset-sort">Restablecer</button>
        <button type="button" class="btn btn-primary" id="btn-done-sort">Listo</button>
      </div>
    </div>
  </dialog>

  <!-- Ficha de un libro de Explorar -->
  <dialog class="sheet" id="catalog-dialog">
    <div class="sheet-body">
      <header class="sheet-header">
        <span class="muted" id="catalog-dialog-category"></span>
        <button type="button" class="icon-btn" id="btn-close-catalog" aria-label="Cerrar">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="catalog-detail">
        <img id="catalog-dialog-cover" alt="">
        <h2 id="catalog-dialog-title"></h2>
        <p class="muted" id="catalog-dialog-author"></p>
      </div>
      <p class="form-error" id="catalog-error" hidden></p>
      <button type="button" class="btn btn-primary" id="btn-add-to-library">Añadir a mi biblioteca</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
